name: Release Electron App

on:
  push:
    branches:
      - master  # 推送到main分支时触发

permissions:
  contents: write  # 必须授权才能创建 Release

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以获取所有tag

      - name: Check version change
        id: check
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          echo "Package version: $PKG_VERSION"
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -n 1)
          echo "Latest tag: $LATEST_TAG"
          if [ "$LATEST_TAG" = "v$PKG_VERSION" ]; then
            echo "Version unchanged ($LATEST_TAG), skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Version changed! v$PKG_VERSION != $LATEST_TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "new_version=$PKG_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.new_version }}"
          git push origin "v${{ steps.check.outputs.new_version }}"

  prepare-assets:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.20.0 --activate

      - name: Install dependencies
        run: npm ci

      - name: Build JSONCrack & Fetch JSONHero (parallel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-jsoncrack.js &
          PID_CRACK=$!
          node scripts/fetch-jsonhero.js &
          PID_HERO=$!
          wait $PID_CRACK || exit 1
          wait $PID_HERO || exit 1

      - name: Upload json-crack artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-crack
          path: json-crack/

      - name: Upload jsonhero artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonhero
          path: jsonhero/

  build:
    needs: [check-version, prepare-assets]
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - platform: windows-latest
            artifact_name: windows
          - platform: ubuntu-latest
            artifact_name: linux
          - platform: macos-latest
            arch: x64
            artifact_name: mac-x64
          - platform: macos-latest
            arch: arm64
            artifact_name: mac-arm64
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download json-crack artifact
        uses: actions/download-artifact@v4
        with:
          name: json-crack
          path: json-crack/

      - name: Download jsonhero artifact
        uses: actions/download-artifact@v4
        with:
          name: jsonhero
          path: jsonhero/

      - name: Configure macOS build
        if: matrix.platform == 'macos-latest'
        run: |
          # 禁用签名（两个架构都需要）
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          # 设置目标架构
          echo "npm_config_arch=${{ matrix.arch }}" >> $GITHUB_ENV
          # 重建 native 模块（关键步骤！）
          npm rebuild --arch=${{ matrix.arch }}

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-

      - name: Build application
        run: npm run build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          # 显式指定目标架构（electron-builder 需要）
          ELECTRON_ARCH: ${{ matrix.arch || 'x64' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            !dist/*.blockmap

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: true  # 合并所有平台的 artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Release v${{ needs.check-version.outputs.new_version }}
          body: |
            ## Changes
            Automated release for v${{ needs.check-version.outputs.new_version }}
            
            ## Installers
            - **Windows**: `setup.exe`
            - **macOS (Intel)**: `*-x64.dmg`
            - **macOS (Apple Silicon)**: `*-arm64.dmg`
            - **Linux**: `*.AppImage`
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.tar.gz