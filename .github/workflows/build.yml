name: Release Electron App

on:
  push:
    tags:
      - 'v*'  # 只有推送到v开头的tag时才触发

permissions:
  contents: write  # 必须授权才能创建 Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            artifact_name: windows
          - platform: ubuntu-latest
            artifact_name: linux
          - platform: macos-latest
            arch: x64
            artifact_name: mac-x64
          - platform: macos-latest
            arch: arm64
            artifact_name: mac-arm64
    
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics - node_modules size
        shell: bash
        run: |
          echo "=== node_modules ==="
          du -sh node_modules 2>/dev/null || echo "du not available"
          echo "=== production deps ==="
          npm ls --prod --all 2>/dev/null || echo "npm ls failed"

      - name: Fetch JSONHero release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-jsonhero.js

      - name: Diagnostics - jsonhero directory
        shell: bash
        run: |
          echo "=== jsonhero/ contents ==="
          ls -laR jsonhero/ 2>/dev/null || echo "ls failed"
          echo "=== jsonhero/ size ==="
          du -sh jsonhero/ 2>/dev/null || echo "du not available"
          echo "=== jsonhero/ top-level dirs ==="
          ls -d jsonhero/*/ 2>/dev/null || echo "no subdirs"

      # 配置 macOS 构建环境
      - name: Configure macOS build
        if: matrix.platform == 'macos-latest'
        run: |
          # 禁用签名（两个架构都需要）
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          # 设置目标架构
          echo "npm_config_arch=${{ matrix.arch }}" >> $GITHUB_ENV
          # 重建 native 模块（关键步骤！）
          npm rebuild --arch=${{ matrix.arch }}

      - name: Build application
        run: npm run build
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # 显式指定目标架构（electron-builder 需要）
          ELECTRON_ARCH: ${{ matrix.arch == 'x64' && 'x64' || 'arm64' }}

      - name: Diagnostics - build output
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/ 2>/dev/null || echo "no dist dir"
          echo "=== dist/ size ==="
          du -sh dist/ 2>/dev/null || echo "du not available"
          echo "=== app.asar size ==="
          ls -lh dist/win-unpacked/resources/app.asar 2>/dev/null || ls -lh dist/mac*/str_toolkit.app/Contents/Resources/app.asar 2>/dev/null || ls -lh dist/linux-unpacked/resources/app.asar 2>/dev/null || echo "no app.asar"
          echo "=== app.asar.unpacked contents ==="
          ls -laR dist/win-unpacked/resources/app.asar.unpacked/ 2>/dev/null || ls -laR dist/mac*/str_toolkit.app/Contents/Resources/app.asar.unpacked/ 2>/dev/null || ls -laR dist/linux-unpacked/resources/app.asar.unpacked/ 2>/dev/null || echo "no app.asar.unpacked"
          echo "=== installer size ==="
          ls -lh dist/*.exe 2>/dev/null || echo "no exe"
          ls -lh dist/*.dmg 2>/dev/null || echo "no dmg"
          ls -lh dist/*.AppImage 2>/dev/null || echo "no AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            !dist/*.blockmap
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true  # 合并所有平台的 artifact

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes
            Automated release for ${{ github.ref_name }}
            
            ## Installers
            - **Windows**: `setup.exe`
            - **macOS (Intel)**: `*-x64.dmg`
            - **macOS (Apple Silicon)**: `*-arm64.dmg`
            - **Linux**: `*.AppImage`
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage